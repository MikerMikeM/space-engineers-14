- type: entity
  parent: BaseStructureComputer
  id: BaseComputer
  name: computer
  placement:
    mode: SnapgridCenter
  components:
  - type: Animateable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: Construction
    graph: Computer
    node: computer
    containers:
      - board
  - type: Computer
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: PowerState
    idlePowerDraw: 50
    workingPowerDraw: 500
  - type: UIPowerState
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["enum.ComputerVisualLayers.Frame"]
    - map: ["enum.ComputerVisualLayers.Keyboard"]
    - map: ["enum.ComputerVisualLayers.Screen"]
    - map: ["enum.ComputerVisualLayers.Keys"]
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: ComputerVisuals
    stateFrame: computer
    stateKeyboard: generic_keyboard
    stateScreen: generic
    stateKeys: generic_keys
    statePanel: generic_panel_open
  - type: Appearance
  # ADT-Tweak start
  - type: EdgeConnection
    connectionKey: computer-console
    allowedDirections: East, West
  - type: GenericVisualizer
    visuals:
      enum.EdgeConnectionVisuals.ConnectionMask:
        computerLayerBody:
          None: { state: computer, sprite: Structures/Machines/computers.rsi }
          West: { state: computer_r, sprite: _ADT/Structures/Machines/computers.rsi }
          East: { state: computer_l, sprite: _ADT/Structures/Machines/computers.rsi }
          East, West: { state: computer_l_r, sprite: _ADT/Structures/Machines/computers.rsi }
  # ADT-Tweak end
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 3.0
    enabled: false
    lightMask: ConeSingle
    autoRot: true
    offset: "0, 0.4" # shine from the top, not bottom of the computer
    castShadows: false
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -1
        variation: 0.10
        pitch: 1.10  # low pitch keyboard sounds feel kinda weird
    blacklist:
      tags:
      - NoConsoleSound
  - type: ContainerContainer
    containers:
      board: !type:Container
        ents: []
  - type: LightningTarget
    priority: 1
  - type: RequireProjectileTarget
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: WiresPanel
  - type: WiresVisuals
  - type: Wires
    boardName: wires-board-name-computer
    layoutId: Computer
#
#     This is overwritten by children, so needs to be defined there
#  - type: UserInterface
#    interfaces:
#      enum.WiresUiKey.Key:
#        type: WiresBoundUserInterface

- type: entity
  parent: BaseComputer
  id: BaseComputerAiAccess
  components:
  - type: StationAiWhitelist
  - type: Wires
    boardName: wires-board-name-computer
    layoutId: ComputerAi
