- type: entity
  id: ADTTableRusty
  parent: ADTTableBase
  name: table
  description: A square piece of metal standing on four metal legs. Rusty.
  components:
  - type: Sprite
    sprite: _ADT/Structures/Furniture/Tables/table_rusty.rsi
  - type: Icon
    sprite: _ADT/Structures/Furniture/Tables/table_rusty.rsi
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: metaltable
    base: state_


