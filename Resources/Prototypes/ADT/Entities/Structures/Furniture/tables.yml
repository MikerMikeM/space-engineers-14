- type: entity
  id: ADTTableRoundPlastic
  parent: BaseStructure
  name: plastic round table
  description: Do not apply fire to this. Rumour says it burns easily.
  components:
  - type: Animateable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors: #excess damage (nuke?). avoid computational cost of spawning entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/metal_break1.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.5
        density: 55
        mask: # tables should collide with other tables
        - TableMask
        layer:
        - TableLayer
  - type: SpriteFade
  - type: Sprite
    sprite: _ADT/Structures/Furniture/Tables/roundtable.rsi
    state: round_plastic
    noRot: true
  - type: Icon
    sprite: _ADT/Structures/Furniture/Tables/roundtable.rsi
    state: round_plastic
  - type: Climbable
  - type: Bonkable
    bonkDamage:
      types:
        Blunt: 4
  - type: Clickable
  - type: Anchorable
  - type: Rotatable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Construction
    graph: ADTTable
    node: adttableroundplastic


