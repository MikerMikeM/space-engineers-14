- type: entity
  id: ADTTableRoundCarpet
  parent: ADTTableRoundPlastic
  name: gambling round table
  description: Play em' cowboy.
  components:
  - type: Sprite
    sprite: _ADT/Structures/Furniture/Tables/roundtable.rsi
    state: round_carpet
  - type: Icon
    sprite: _ADT/Structures/Furniture/Tables/roundtable.rsi
    state: round_carpet
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 1
            max: 1
          MaterialCloth1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag
    tags:
    - Wooden
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCarpet
  - type: Construction
    graph: ADTTable
    node: adttableroundcarpet

