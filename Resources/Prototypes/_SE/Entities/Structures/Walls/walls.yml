- type: entity
  parent: WallShuttleDiagonal
  id: WallRivetedDiagonal
  name: riveted wall
  suffix: diagonal
  description: Skub knows this wall is too hard to destroy.
  components:
  - type: Occluder
    enabled: false
  - type: Sprite
    drawdepth: Walls
    sprite: _SE/Structures/Walls/riveted_diagonal.rsi
    state: state0
    color: "#ffffff"
  - type: Icon
    sprite: _SE/Structures/Walls/riveted_diagonal.rsi
    state: state0
  - type: ExplosionResistance
    damageCoefficient: 0.8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            Girder:
              min: 1
              max: 1
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: StaticPrice
    price: 250

- type: entity
  parent: BaseWall
  id: WallKrissReinforced
  name: reinforced wall
  components:
  - type: Sprite
    sprite: _SE/Structures/Walls/Krisswall.rsi
  - type: Icon
    sprite: _SE/Structures/Walls/Krisswall.rsi
    state: rgeneric
#  - type: Construction
#    graph: Girder
#    node: WallKrissReinforced
  - type: Damageable
    damageModifierSet: StructuralMetallicStrong
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    base: reinf_over
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ReinforcedWallVisuals.DeconstructionStage:
        ReinforcedWallVisualLayers.Deconstruction:
          -1: { visible: false }
          0: { state: reinf_construct-0, visible: true}
          1: { state: reinf_construct-1, visible: true}
          2: { state: reinf_construct-2, visible: true}
          3: { state: reinf_construct-3, visible: true}
          4: { state: reinf_construct-4, visible: true}
          5: { state: reinf_construct-5, visible: true}
  - type: ReinforcedWallReplacementMarker
  - type: StaticPrice
    price: 120
  - type: RadiationBlocker
    resistance: 5

- type: entity
  parent: BaseWall
  id: WallKrissSolid
  name: solid wall
  components:
  - type: Sprite
    sprite: _SE/Structures/Walls/Krisswall.rsi
  - type: WallReplacementMarker
  - type: Construction
    graph: Girder
    node: WallKrissSolid
  - type: Icon
    sprite: _SE/Structures/Walls/Krisswall.rsi
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    base: solid

- type: entity
  parent: WallShuttleDiagonal
  id: WallKrissSolidDiagonal
  name: solid wall
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _SE/Structures/Walls/Krisswall_diagonal.rsi
    state: state0
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: state
  - type: Icon
    sprite: _SE/Structures/Walls/Krisswall_diagonal.rsi
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
