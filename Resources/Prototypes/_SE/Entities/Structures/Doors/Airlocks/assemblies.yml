    sprite: _SE/Structures/Doors/Airlocks/Glass/glass_old.rsi
    state: "assembly"

- type: entity
  parent: AirlockAssembly
  id: AirlockAssemblyGlassOldWide
  suffix:
  components:
  - type: Sprite
    sprite: _SE/Structures/Doors/Airlocks/Glass/big_glass_old.rsi
    state: "assembly"
    snapCardinals: false
    offset: 0.5,0
  - type: Transform
    noRot: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,1.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - GlassAirlockLayer

