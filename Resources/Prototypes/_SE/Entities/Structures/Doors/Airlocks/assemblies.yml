#region Glass

# Modern Glass Assemblies
- type: entity
  parent: AirlockAssembly
  id: AirlockAssemblySecurityGlassOld
  suffix: Security, Glass
  components:
  - type: Sprite
    sprite: _SE/Structures/Doors/Airlocks/Glass/secairlockredglass.rsi
    state: "assembly"

- type: entity
  parent: AirlockAssembly
  id: AirlockAssemblyRepresentativeGlass
  suffix: Sr
  components:
  - type: Sprite
    sprite: _SE/Structures/Doors/Airlocks/Glass/representative.rsi
    state: "assembly"

- type: entity
  parent: AirlockAssembly
  id: AirlockOldAssemblyGlass
  components:
  - type: Sprite
    sprite: _SE/Structures/Doors/Airlocks/Glass/basic_old.rsi
    state: "assembly"

- type: entity
  parent: AirlockAssembly
