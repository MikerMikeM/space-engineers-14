  parent: AirlockGlass
  name: big glass airlock
  description: This looks like some hydraulic press... It opens, it closes, it can crush you.
  suffix: 3-tiled
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.49,-0.49,1.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - GlassAirlockLayer
  - type: Sprite
    snapCardinals: false
