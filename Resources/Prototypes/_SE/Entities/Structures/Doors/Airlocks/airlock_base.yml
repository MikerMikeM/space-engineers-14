- type: entity
  parent: Airlock
  id: AirlockBaseLua
  name: airlock
  abstract: true
  suffix: Base, Hatch
  components:
  - type: Door
    crushDamage:
      types:
        Blunt: 15
    openSound:
      path: /Audio/_SE/Machines/Airlocks/airlock_open.ogg
    closeSound:
      path: /Audio/_SE/Machines/Airlocks/airlock_close.ogg
    denySound:
      path: /Audio/_SE/Machines/Airlocks/airlock_deny.ogg
  - type: DoorBolt
    boltUpSound:
      path: /Audio/_SE/Machines/Airlocks/boltsup.ogg
    boltDownSound:
      path: /Audio/_SE/Machines/Airlocks/boltsdown.ogg
  - type: Sprite
    sprite: _SE/Structures/Doors/Airlocks/Standard/hatch_atmos_lua.rsi
    snapCardinals: true
    layers:
    - state: closed_color
      map: ["enum.DoorVisualLayers.BaseColor"]
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: false
    - state: welded
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: bolted_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - state: emergency_unlit
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
      shader: unshaded
    - state: panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]

