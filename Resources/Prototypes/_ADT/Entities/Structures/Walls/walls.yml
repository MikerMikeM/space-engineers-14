- type: entity
  parent: BaseWall
  id: ADTDigitalWall
  name: digital wall
  description: What do you even know about the matrix?
  components:
  - type: Sprite
    sprite: _ADT/Structures/Walls/digital_wall.rsi
  - type: Icon
    sprite: _ADT/Structures/Walls/digital_wall.rsi
  - type: IconSmooth
    key: walls
    base: digital
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 550
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]

