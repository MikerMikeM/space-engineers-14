name: "Labels: Changes"

on:
  pull_request_review:
    types: [submitted]

jobs:
  update_label:
    permissions:
      pull-requests: write
    if: github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    steps:
    - uses: actions-ecosystem/action-add-labels@1a9c3715c0037e96b97bb38cb4c4b56a1f1d4871 # _SE
      with:
        labels: "Status: Awaiting Changes"
    - uses: actions-ecosystem/action-remove-labels@d05162525702062b6bdef750ed8594fc024b3ed7 # _SE
      with:
        labels: "Status: Needs Review"
