name: "Labels: Approve"

on:
  pull_request_review:
    types: [submitted]

jobs:
  remove_label:
    permissions:
      pull-requests: write
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
    - uses: actions-ecosystem/action-remove-labels@d05162525702062b6bdef750ed8594fc024b3ed7 # _SE
      with:
        labels: |
          Status: Needs Review
          Status: Awaiting Changes
