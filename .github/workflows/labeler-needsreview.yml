name: "Labels: Review"

on:
  pull_request_target:
    types: [review_requested, opened]

jobs:
  add_label:
    permissions: # _SE
      pull-requests: write # _SE
    runs-on: ubuntu-latest
    steps:
    - uses: actions-ecosystem/action-add-labels@1a9c3715c0037e96b97bb38cb4c4b56a1f1d4871 # _SE
      with:
        labels: "S: Needs Review"
    - uses: actions-ecosystem/action-remove-labels@d05162525702062b6bdef750ed8594fc024b3ed7 # _SE
      with:
        labels: "S: Awaiting Changes"